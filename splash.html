<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Classic Reading - Reimagined</title>
<style>
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#050505;
}
#splash{
 position:fixed;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#050505;
 animation:fade 1.2s ease 4.8s forwards;
}
#splash img{
 width:100%;
 height:100%;
 object-fit:contain;
 animation:zoom 6s ease forwards;
}
@keyframes zoom{
 from{transform:scale(1)}
 to{transform:scale(1.05)}
}
@keyframes fade{
 to{opacity:0}
}
#text{
 position:absolute;
 color:#d3ad62;
 text-align:center;
 font-family:Georgia,serif;
 letter-spacing:.12em;
 text-shadow:0 2px 12px black;
}
h1{font-size:clamp(24px,5vw,48px);margin:0}
p{color:#eee;font-size:clamp(12px,2vw,18px)}
</style>
</head>
<body>
<div id="splash">
 <img src="assets/splash.png">
 <div id="text">
  <h1>Classic Reading - Reimagined</h1>
  <p>Gatefold Reader<br>Designed by Jeff Patrick</p>
 </div>
</div>

<script>
setTimeout(()=>{
 window.location.href="index.html";
},6000);
</script>
</body>
</html>
